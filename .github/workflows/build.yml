jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unzip project
        run: |
          ls -la
          unzip -o TikTokLiveMonitor.zip -d .
          ls -la
          find . -maxdepth 3 -type d -name "TikTokLiveMonitor" -o -name "app"

      - name: Build
        working-directory: TikTokLiveMonitor
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: TikTokLiveMonitor/app/build/outputs/apk/debug/app-debug.apk
